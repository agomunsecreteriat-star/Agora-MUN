<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AGOMUN | Chair Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #07152f, #0b2348, #102f5c);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .background-circle {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            top: -180px;
            right: -120px;
        }

        .background-circle2 {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            bottom: -150px;
            left: -120px;
        }

        .login-container {
            width: 92%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 42px 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            position: relative;
            z-index: 2;
        }

        .logo {
            width: 85px;
            height: 85px;
            margin: 0 auto 18px;
            border-radius: 50%;
            object-fit: contain;
            display: block;
            background: white;
            padding: 6px;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            margin-top: 8px;
            color: #c8d4e8;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #dce6f5;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.18);
            color: white;
            outline: none;
            font-size: 14px;
            transition: 0.25s;
        }

        input::placeholder {
            color: #8e9db4;
        }

        input:focus {
            border-color: #8fb7ff;
            box-shadow: 0 0 0 3px rgba(143,183,255,0.12);
        }

        .login-button {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #09234a;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        .error {
            display: none;
            color: #ffb4b4;
            font-size: 13px;
            text-align: center;
            margin-top: 15px;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #9eacc1;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #cbd8eb;
            text-decoration: none;
            font-size: 12px;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="background-circle"></div>
    <div class="background-circle2"></div>

    <div class="login-container">

        <!-- LOGO -->
        <img src="logo.png" alt="AGOMUN Logo" class="logo">

        <h1 class="title">Chair Portal</h1>

        <p class="subtitle">
            AGOMUN Secretariat Management System
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Chair Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="chair@agomun.org"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                Sign In
            </button>

            <p class="error" id="errorMessage">
                Invalid email or password.
            </p>

        </form>

        <a href="index.html" class="back">
            ← Back to AGOMUN
        </a>

        <div class="footer">
            © 2026 AGOMUN Secretariat
        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const error = document.getElementById("errorMessage");

            /*
             * TEMPORARY LOGIN
             * We will replace this with a real authentication system.
             */

            if (email === "chair@agomun.org" && password === "AGOMUN2026") {

                window.location.href = "chair-dashboard.html";

            } else {

                error.style.display = "block";

            }

        });
    </script>

</body>
</html>
