<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AGOMUN | Chair Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="portal-card">

            <img src="logo.png" class="logo" alt="AGOMUN Logo">

            <h1 class="title">Chair Portal</h1>

            <p class="subtitle">
                AGOMUN Secretariat & Chair Management System
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Chair Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="chair@agomun.org"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    Login to Chair Portal
                </button>

                <div class="error" id="errorMessage">
                    Invalid email or password.
                </div>

            </form>

            <div class="footer">
                © 2026 AGOMUN Secretariat
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
